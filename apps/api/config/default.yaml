app:
  name: amazon-mvp-api
  environment: local
  port: 3001
  logLevel: info

database:
  # Overridden by DATABASE_URL (Kubernetes Secret). Never commit real credentials.
  url: postgresql://postgres:postgres@localhost:5432/amazon_mvp?schema=public

session:
  cookieName: amzmvp_sid
  ttlHours: 168
  secureCookie: false
  sameSite: lax

openapi:
  enabled: true
  path: /api/docs

checkout:
  # "5% de desconto à vista no Pix". Whole percent, 0-100 (0 disables the discount).
  # Overridden by PIX_DISCOUNT_PERCENT.
  pixDiscountPercent: 5
  # Interest-free card installments (CARD-001): up to maxInstallments, each at least
  # minInstallmentMinor cents. Overridden by MAX_INSTALLMENTS / MIN_INSTALLMENT_MINOR.
  maxInstallments: 10
  minInstallmentMinor: 500
