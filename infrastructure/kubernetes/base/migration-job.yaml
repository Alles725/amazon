apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  # Jobs are immutable once created, so `make migrate` deletes this Job before
  # re-applying it. ttlSecondsAfterFinished also reaps it automatically.
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-migrate }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: amazon-mvp/api:dev
          workingDir: /repo/database
          # `migrate deploy` only applies committed migrations — it never
          # generates or resets, which is what you want in a cluster.
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: api-secret, key: DATABASE_URL }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
