apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: { app.kubernetes.io/name: storefront }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: storefront }
  template:
    metadata:
      labels: { app.kubernetes.io/name: storefront }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: storefront
          image: amazon-mvp/storefront:dev
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: storefront-config }
          volumeMounts:
            # Feature flags come from a ConfigMap so they can be flipped without
            # rebuilding an image.
            - name: features
              mountPath: /app/config
              readOnly: true
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: features
          configMap: { name: features-config }
