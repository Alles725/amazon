apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amazon-mvp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Longest prefix first: /api must not be swallowed by /.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port: { number: 3000 }
