# Single source of truth for what is switched on. Everything ships disabled and
# is turned on here once implemented and tested.
features:
  home:
    enabled: true
    description: Landing page

  authentication:
    enabled: true
    description: Register, login, logout, account shell

  catalog:
    enabled: false
    description: Product listing

  productDetails:
    enabled: true
    description: Dynamic product details with catalog data and cart integration

  productReviews:
    enabled: false
    description: Writing customer reviews (the product page reads demo reviews until a backend exists)

  cart:
    enabled: true
    description: Persistent account cart with quantities and subtotals

  checkout:
    enabled: true
    description: Academic checkout with saved addresses and persisted orders

  orders:
    enabled: true
    description: Order history ("Seus pedidos") and order details

  account:
    enabled: false
    description: Account management beyond the auth shell

  browsingHistory:
    enabled: true
    description: Device-local browsing history flyout in the header navbar

  # Footer informational pages. Each is an independent, content-only page —
  # not part of a vertical slice — so one team member can build any one of
  # them without touching the others.
  about:
    enabled: true
    description: About Amazon
  corporateInformation:
    enabled: true
    description: Corporate information
  careers:
    enabled: true
    description: Careers
  press:
    enabled: true
    description: Press releases
  community:
    enabled: true
    description: Community
  accessibility:
    enabled: true
    description: Accessibility
  amazonScience:
    enabled: true
    description: Amazon Science
  sell:
    enabled: true
    description: Sell on Amazon
  brandProtection:
    enabled: true
    description: Brand protection and building
  supply:
    enabled: true
    description: Supply to Amazon
  publish:
    enabled: true
    description: Self-publish books
  associates:
    enabled: true
    description: Become an associate
  advertise:
    enabled: true
    description: Advertise products
  paymentMethods:
    enabled: false
    description: Accepted payment methods
  points:
    enabled: false
    description: Buy with points
  creditCard:
    enabled: false
    description: Amazon credit card
  shipping:
    enabled: false
    description: Shipping and delivery times
  returns:
    enabled: false
    description: Returns and refunds
  contentAndDevices:
    enabled: false
    description: Manage content and devices
  recalls:
    enabled: false
    description: Product recalls and safety alerts
  help:
    enabled: true
    description: Customer help center

  # Account dropdown / account hub destinations that do not have a dedicated
  # vertical slice yet. Each ships disabled behind its own flag, same as the
  # footer pages above.
  security:
    enabled: false
    description: Account access and security settings
  addresses:
    enabled: false
    description: Saved addresses
  giftCards:
    enabled: false
    description: Gift cards
  refunds:
    enabled: false
    description: Boleto/Pix refunds
  messages:
    enabled: false
    description: Buyer/seller messages
  lists:
    enabled: false
    description: Shopping and wish lists
  prime:
    enabled: false
    description: Prime membership
  subscriptions:
    enabled: false
    description: Digital subscriptions
  subscribeAndSave:
    enabled: false
    description: Subscribe & Save recurring deliveries

# Route -> feature binding. `disabledBehavior` decides what a visitor sees when
# the backing feature is off.
routes:
  home:
    feature: home
    disabledBehavior: not-found

  login:
    feature: authentication
    disabledBehavior: coming-soon

  register:
    feature: authentication
    disabledBehavior: coming-soon

  products:
    feature: catalog
    disabledBehavior: coming-soon

